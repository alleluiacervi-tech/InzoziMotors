name: Deploy

# ─────────────────────────────────────────────────────────────────────────────
# Continuous delivery to the VPS — with the builds where they belong.
#
# The first version of this workflow ran ops/deploy.sh and let the SERVER
# build the Docker images. Twice in one evening that wedged: two Next.js
# compiles on a small box that is simultaneously serving production ground
# past 20–40 minutes with no way to see inside. So the runner now builds the
# exact images (same compose file, same build args), ships them over SSH with
# docker save/load, and the server's only jobs are: load, migrate, restart,
# health-check. A deploy costs the VPS seconds of CPU, not half an hour.
#
# ops/deploy.sh still owns the deploy semantics — dirty-tree refusal, rollback
# pointer, DB backup when migrations are present, readiness poll — invoked
# with SKIP_BUILD=1. One implementation of "deploy", by hand or by CI.
#
# Runs after CI is green on main, or on demand. environment: production means
# an approval gate can be added in repo settings without touching this file.
#
# ── Why this ships whole images instead of pulling layers ────────────────────
# `docker save | ssh docker load` sends every byte of all three images on every
# deploy, where a registry would send only the layers that changed. That is a
# real cost and the fix is known — build on the runner, push per-commit tags to
# GHCR, `docker compose pull` on the host. It is deliberately NOT in this
# change: the host executes the deploy script it already has on disk, so a
# registry-shaped script cannot bootstrap itself onto a host running the old
# one, and the rollback lever has no credential to pull with. Both of those
# fail in the direction that reports success. docs/DEPLOY-PHASE-2.md has the
# full list of what must be true first.
#
# What this change DOES carry is the actual root cause of the 27-minute
# "deploy": the API image's entrypoint discarded the command it was given, so
# `compose run … node src/migrate.js` booted a second API server in the
# foreground and never returned. That fix lives in the image and in
# ops/deploy.sh's bounded, --entrypoint-pinned migration — not in how the image
# travels.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    # NOTE: this filter matches workflow_run.head_branch, which for a pull
    # request from a FORK is the branch name in the fork — attacker-chosen. It
    # is not a trust boundary. The job's `if:` below is.
    branches: [main]
  workflow_dispatch:
    inputs:
      revision:
        description: 'Tag, branch or SHA to deploy (default: the triggering commit)'
        required: false
        default: ''

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build on runner, ship to production
    runs-on: ubuntu-latest
    # The job cap must exceed the sum of its step caps (2+2+5+20+2+25+50+5+5 =
    # 116), or it preempts them and kills the deploy at whatever point it had
    # reached — which is the failure this whole file is trying to stop happening.
    timeout-minutes: 125
    # THE TRUST BOUNDARY. `workflow_run` runs in the BASE repo's context with
    # full access to secrets, so "CI passed" is not enough to authorise it: CI
    # also runs on pull requests from forks, and the `branches: [main]` filter
    # above matches the fork's own branch name. A contributor who names their
    # branch `main` and gets CI green would otherwise reach this job — which
    # SSHes to the VPS with VPS_SSH_KEY and runs their Dockerfile in production.
    #
    # So: require the triggering run to have been a PUSH, and to have come from
    # THIS repository, not a fork of it.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    environment:
      name: production
      url: https://sawacars.com

    steps:
      - name: Check required secrets are present
        timeout-minutes: 2
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          missing=
          [ -n "$HOST" ] || missing="$missing VPS_HOST"
          [ -n "$USER" ] || missing="$missing VPS_USER"
          [ -n "$KEY" ]  || missing="$missing VPS_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            exit 1
          fi

      # Deploy the exact commit CI validated (workflow_run), or what was asked
      # for (dispatch input), or the current main as a last resort. The runner
      # BUILDS this same ref, and the server CHECKS OUT this same ref — the
      # two must never drift apart.
      - name: Resolve the revision
        id: rev
        timeout-minutes: 2
        env:
          INPUT_REV: ${{ inputs.revision }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          REV="${INPUT_REV:-${HEAD_SHA:-${GITHUB_SHA}}}"

          # This value becomes an argument to ops/deploy.sh on the production
          # host. It is passed through printf %q there, but "quoted" is not the
          # same as "meaningful": anything that cannot be a git ref cannot be a
          # deploy target, and refusing it here produces an error that names the
          # input instead of a shell or git failure 200 lines into a remote
          # heredoc. Allowed: letters, digits, dot, underscore, slash, hyphen —
          # which covers SHAs, `v1.2.0`, `origin/main` and `release/1.0`.
          case "$REV" in
            '')
              echo "::error::No revision to deploy (empty input and no triggering commit)"
              exit 1 ;;
            -*)
              echo "::error::Revision '${REV}' starts with '-'; that is an option, not a ref"
              exit 1 ;;
            *[!A-Za-z0-9._/-]*)
              echo "::error::Revision '${REV}' contains characters that cannot appear in a git ref (allowed: A-Z a-z 0-9 . _ / -)"
              exit 1 ;;
            *'..'*)
              echo "::error::Revision '${REV}' contains '..'; that is a range or a path traversal, not a ref"
              exit 1 ;;
          esac

          echo "rev=$REV" >> "$GITHUB_OUTPUT"
          echo "Deploying revision: $REV"

      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          ref: ${{ steps.rev.outputs.rev }}

      - name: Build the production images
        # Observed cold, no cache, all three images: 2m26s. Twenty minutes is
        # room for a slow runner, not an expectation.
        timeout-minutes: 20
        run: |
          set -euo pipefail
          # Parse-only placeholders: docker-compose.prod.yml uses ${VAR:?}
          # required-variable syntax for runtime secrets. `compose build` never
          # uses their values, but compose interpolates the whole file before
          # doing anything, so it needs SOMETHING to parse. These never leave
          # the runner and never enter an image.
          export DB_PASSWORD=parse-only JWT_SECRET=parse-only-not-a-real-secret \
                 SEED_ADMIN_PASSWORD=parse-only
          docker compose -f docker-compose.prod.yml build api web admin

      - name: Load the deploy key
        timeout-minutes: 2
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "${{ secrets.VPS_HOST_KEY }}" ]; then
            printf '%s\n' "${{ secrets.VPS_HOST_KEY }}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -T 15 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Ship the images
        # Observed 37s for the whole save + upload + load. The cap has to cover
        # try_net's five attempts and their 30s waits (150s of pure waiting)
        # on top of a slow transfer, so: twenty-five minutes.
        timeout-minutes: 25
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          echo "Saving images…"
          docker save sawa-api:latest sawa-web:latest sawa-admin:latest | gzip -1 > /tmp/sawa-images.tgz
          ls -lh /tmp/sawa-images.tgz
          # The host's intrusion protection has been observed dropping SOME
          # runner IPs (connection timeout) while accepting others minutes
          # apart. A timeout here is worth patient retries before it is worth
          # a failed deploy.
          try_net() {
            for attempt in 1 2 3 4 5; do
              "$@" && return 0
              echo "attempt $attempt failed — waiting 30s"
              sleep 30
            done
            return 1
          }
          echo "Uploading…"
          try_net scp -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              /tmp/sawa-images.tgz "$USER@$HOST:/tmp/sawa-images.tgz"
          echo "Loading on the server…"
          try_net ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              "$USER@$HOST" 'gunzip -c /tmp/sawa-images.tgz | docker load && rm -f /tmp/sawa-images.tgz'

      # ── The cap that matters ───────────────────────────────────────────────
      # ops/deploy.sh bounds each of its own steps. This cap must sit ABOVE the
      # sum of those bounds, because whichever timeout fires first decides where
      # the deploy stops — and only the inner ones stop it at a safe point with
      # a message saying what happened. A runner that kills the SSH session
      # instead can cut between the migration and the restart: new schema
      # applied, new code checked out, OLD containers still serving, and nothing
      # on the host recording that it happened. That is the original 27-minute
      # outage, reproduced faster.
      #
      # ops/deploy.sh on the CI path (SKIP_BUILD=1, so the 2400s local-build
      # fallback is never reached):
      #     git fetch            120
      #     ops/backup.sh        900   (migration-bearing deploys only)
      #     up -d db             180
      #     reap one-offs        120
      #     migrate              300   (MIGRATE_TIMEOUT)
      #     up -d api web admin  300
      #     readiness poll       150   (30 × (curl -m 3 + sleep 2))
      #     scoped image cleanup 120
      #                        ─────
      #                         2190  = 36m30s
      # plus this step's own connect probe: 5 × (20s ConnectTimeout + 30s wait)
      #                          250  =  4m10s
      #                        ─────
      #                         2440  = 40m40s worst case
      #
      # 50 minutes leaves ~15% headroom. If a budget in ops/deploy.sh changes,
      # change this number in the same commit.
      - name: Deploy
        timeout-minutes: 50
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          APP_DIR: ${{ secrets.VPS_APP_DIR }}
          REVISION: ${{ steps.rev.outputs.rev }}
        run: |
          set -euo pipefail
          # Same patience as the ship step — probe until the connection holds.
          for attempt in 1 2 3 4 5; do
            if ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "$USER@$HOST" true; then
              break
            fi
            if [ "$attempt" = 5 ]; then echo "::error::server unreachable over SSH"; exit 1; fi
            echo "connect attempt $attempt failed — waiting 30s"; sleep 30
          done
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              "$USER@$HOST" \
              "APP_DIR=$(printf %q "$APP_DIR") REVISION=$(printf %q "$REVISION") bash -s" <<'REMOTE'
          set -euo pipefail
          APP_DIR="${APP_DIR:-}"
          REVISION="${REVISION:-origin/main}"
          if [ -z "$APP_DIR" ]; then
            for candidate in /srv/sawa /opt/sawa /root/sawa /var/www/sawa; do
              [ -x "$candidate/ops/deploy.sh" ] && APP_DIR="$candidate" && break
            done
          fi
          [ -n "$APP_DIR" ] || { echo "::error::Could not locate the checkout — set the VPS_APP_DIR secret"; exit 1; }
          cd "$APP_DIR"

          [ -f docker-compose.prod.yml ] || { echo "::error::docker-compose.prod.yml not found in $APP_DIR"; exit 1; }
          export COMPOSE="docker compose -f docker-compose.prod.yml"
          export SKIP_BUILD=1

          echo "Deploying $REVISION in $APP_DIR (pre-built images)"
          ops/deploy.sh "$REVISION"

          # Bootstrap-safe: the deploy may have started with an older script
          # from the host checkout. The target revision is now on disk, so run
          # the scoped cleaner explicitly. It can remove only labeled Sawa
          # images carrying Sawa's ownership label; global prune is forbidden
          # because this Docker daemon is shared with another project.
          ops/prune-deploy-images.sh || true
          REMOTE

      - name: Verify the public surfaces answer
        timeout-minutes: 5
        run: |
          set -euo pipefail
          fail=0
          for url in https://sawacars.com https://api.sawacars.com/health/ready https://admin.sawacars.com; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -L "$url" || echo 000)
            case "$code" in
              200|301|302|307|308) echo "ok   $url -> $code" ;;
              *) echo "FAIL $url -> $code"; fail=1 ;;
            esac
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::A public surface did not answer after deploy — consider ops/rollback.sh"
            exit 1
          fi

      - name: Report what is running
        if: always()
        timeout-minutes: 5
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              "$USER@$HOST" "APP_DIR=$(printf %q "$APP_DIR") bash -s" \
              <<'REMOTE' >> "$GITHUB_STEP_SUMMARY" || true
          APP_DIR="${APP_DIR:-}"
          if [ -z "$APP_DIR" ]; then
            for c in /srv/sawa /opt/sawa /root/sawa /var/www/sawa; do
              [ -d "$c/.git" ] && APP_DIR="$c" && break
            done
          fi
          cd "$APP_DIR" 2>/dev/null || exit 0
          echo "### Deployed revision"
          echo ''
          echo '```'
          git log -1 --format='%h  %s  (%an, %ar)' 2>/dev/null || true
          echo '```'
          echo ''
          echo '### VPS storage after cleanup'
          echo ''
          echo '```'
          df -h "$(docker info --format '{{.DockerRootDir}}' 2>/dev/null || echo /)" 2>/dev/null | tail -2 || true
          docker system df 2>/dev/null || true
          echo
          echo 'Sawa-managed images:'
          docker image ls --filter 'label=com.sawacars.managed=true' \
            --format '{{.Repository}}:{{.Tag}}  {{.ID}}  {{.Size}}' 2>/dev/null || true
          echo '```'
          REMOTE
