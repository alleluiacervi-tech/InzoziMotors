name: Deploy

# ─────────────────────────────────────────────────────────────────────────────
# Continuous delivery to the VPS — with the builds where they belong.
#
# The first version of this workflow ran ops/deploy.sh and let the SERVER
# build the Docker images. Twice in one evening that wedged: two Next.js
# compiles on a small box that is simultaneously serving production ground
# past 20–40 minutes with no way to see inside. So the runner now builds the
# exact images (same compose file, same build args), ships them over SSH with
# docker save/load, and the server's only jobs are: load, migrate, restart,
# health-check. A deploy costs the VPS seconds of CPU, not half an hour.
#
# ops/deploy.sh still owns the deploy semantics — dirty-tree refusal, rollback
# pointer, DB backup when migrations are present, readiness poll — invoked
# with SKIP_BUILD=1. One implementation of "deploy", by hand or by CI.
#
# Runs after CI is green on main, or on demand. environment: production means
# an approval gate can be added in repo settings without touching this file.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      revision:
        description: 'Tag, branch or SHA to deploy (default: the triggering commit)'
        required: false
        default: ''

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build on runner, ship to production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: production
      url: https://sawacars.com

    steps:
      - name: Check required secrets are present
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          missing=
          [ -n "$HOST" ] || missing="$missing VPS_HOST"
          [ -n "$USER" ] || missing="$missing VPS_USER"
          [ -n "$KEY" ]  || missing="$missing VPS_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            exit 1
          fi

      # Deploy the exact commit CI validated (workflow_run), or what was asked
      # for (dispatch input), or the current main as a last resort. The runner
      # BUILDS this same ref, and the server CHECKS OUT this same ref — the
      # two must never drift apart.
      - name: Resolve the revision
        id: rev
        env:
          INPUT_REV: ${{ inputs.revision }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          REV="${INPUT_REV:-${HEAD_SHA:-${GITHUB_SHA}}}"
          echo "rev=$REV" >> "$GITHUB_OUTPUT"
          echo "Deploying revision: $REV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.rev.outputs.rev }}

      - name: Build the production images
        run: |
          set -euo pipefail
          # Parse-only placeholders: docker-compose.prod.yml uses ${VAR:?}
          # required-variable syntax for runtime secrets. `compose build` never
          # uses their values, but compose interpolates the whole file before
          # doing anything, so it needs SOMETHING to parse. These never leave
          # the runner and never enter an image.
          export DB_PASSWORD=parse-only JWT_SECRET=parse-only-not-a-real-secret \
                 SEED_ADMIN_PASSWORD=parse-only
          docker compose -f docker-compose.prod.yml build api web admin

      - name: Load the deploy key
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "${{ secrets.VPS_HOST_KEY }}" ]; then
            printf '%s\n' "${{ secrets.VPS_HOST_KEY }}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -T 15 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Ship the images
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          echo "Saving images…"
          docker save sawa-api:latest sawa-web:latest sawa-admin:latest | gzip -1 > /tmp/sawa-images.tgz
          ls -lh /tmp/sawa-images.tgz
          # The host's intrusion protection has been observed dropping SOME
          # runner IPs (connection timeout) while accepting others minutes
          # apart. A timeout here is worth patient retries before it is worth
          # a failed deploy.
          try_net() {
            for attempt in 1 2 3 4 5; do
              "$@" && return 0
              echo "attempt $attempt failed — waiting 30s"
              sleep 30
            done
            return 1
          }
          echo "Uploading…"
          try_net scp -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              /tmp/sawa-images.tgz "$USER@$HOST:/tmp/sawa-images.tgz"
          echo "Loading on the server…"
          try_net ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              "$USER@$HOST" 'gunzip -c /tmp/sawa-images.tgz | docker load && rm -f /tmp/sawa-images.tgz'

      - name: Deploy
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          APP_DIR: ${{ secrets.VPS_APP_DIR }}
          REVISION: ${{ steps.rev.outputs.rev }}
        run: |
          set -euo pipefail
          # Same patience as the ship step — probe until the connection holds.
          for attempt in 1 2 3 4 5; do
            if ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 "$USER@$HOST" true; then
              break
            fi
            if [ "$attempt" = 5 ]; then echo "::error::server unreachable over SSH"; exit 1; fi
            echo "connect attempt $attempt failed — waiting 30s"; sleep 30
          done
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              "$USER@$HOST" \
              "APP_DIR=$(printf %q "$APP_DIR") REVISION=$(printf %q "$REVISION") bash -s" <<'REMOTE'
          set -euo pipefail
          APP_DIR="${APP_DIR:-}"
          REVISION="${REVISION:-origin/main}"
          if [ -z "$APP_DIR" ]; then
            for candidate in /srv/sawa /opt/sawa /root/sawa /var/www/sawa; do
              [ -x "$candidate/ops/deploy.sh" ] && APP_DIR="$candidate" && break
            done
          fi
          [ -n "$APP_DIR" ] || { echo "::error::Could not locate the checkout — set the VPS_APP_DIR secret"; exit 1; }
          cd "$APP_DIR"

          [ -f docker-compose.prod.yml ] || { echo "::error::docker-compose.prod.yml not found in $APP_DIR"; exit 1; }
          export COMPOSE="docker compose -f docker-compose.prod.yml"
          export SKIP_BUILD=1

          echo "Deploying $REVISION in $APP_DIR (pre-built images)"
          ops/deploy.sh "$REVISION"

          # The save/load cycle strands the previous images as dangling layers;
          # left alone they eat the disk one deploy at a time.
          docker image prune -f >/dev/null || true
          REMOTE

      - name: Verify the public surfaces answer
        run: |
          set -euo pipefail
          fail=0
          for url in https://sawacars.com https://api.sawacars.com/health/ready https://admin.sawacars.com; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -L "$url" || echo 000)
            case "$code" in
              200|301|302|307|308) echo "ok   $url -> $code" ;;
              *) echo "FAIL $url -> $code"; fail=1 ;;
            esac
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::A public surface did not answer after deploy — consider ops/rollback.sh"
            exit 1
          fi

      - name: Report what is running
        if: always()
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              "$USER@$HOST" "APP_DIR=$(printf %q "$APP_DIR") bash -s" \
              <<'REMOTE' >> "$GITHUB_STEP_SUMMARY" || true
          APP_DIR="${APP_DIR:-}"
          if [ -z "$APP_DIR" ]; then
            for c in /srv/sawa /opt/sawa /root/sawa /var/www/sawa; do
              [ -d "$c/.git" ] && APP_DIR="$c" && break
            done
          fi
          cd "$APP_DIR" 2>/dev/null || exit 0
          echo "### Deployed revision"
          echo ''
          echo '```'
          git log -1 --format='%h  %s  (%an, %ar)' 2>/dev/null || true
          echo '```'
          REMOTE
