name: Mobile Submit

# ─────────────────────────────────────────────────────────────────────────────
# The last step of a store release, on its own, on purpose.
#
# mobile-build.yml cuts a binary but deliberately stops there: submitting to a
# store is a statement to Apple or Google that a release is ready, and CLAUDE.md
# §9 keeps that a human act. mobile-build's own `submit: true` input couples the
# two, which means every submit rebuilds — wasting the binary the auto-build
# already made for the same commit.
#
# This workflow is submit on its own. It uploads a build that ALREADY EXISTS on
# EAS to the store, so the common case — a native change merged, mobile-build
# made the binary, now send that same binary to Apple — costs no second build.
# `eas submit --latest` picks the newest finished build for the platform, and
# waits for it if it is still building.
#
# It never runs itself. There is no push or schedule trigger: a person decides a
# release is ready and dispatches it. iOS is the default because the App Store
# listing is live; Android stays a manual choice until its Play listing exists.
#
# ── Before the first successful iOS submit ───────────────────────────────────
# `eas submit` authenticates to App Store Connect with the API key stored on the
# EAS credentials service. That key needs its Apple Team ID (5Z2LA9U639) set, or
# submit falls back to an interactive prompt and dies here with no stdin. The id
# is pinned in eas.json (submit.production.ios.appleTeamId); if submit still
# fails to authenticate, the API key itself must be (re)added on expo.dev.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Store to submit to'
        type: choice
        options: [ios, android, all]
        default: ios
        required: false
      profile:
        description: 'EAS submit profile'
        type: choice
        options: [production, preview]
        default: production
        required: false

concurrency:
  # One submit of a given profile at a time. Two racing submits of the same
  # build help nobody and can confuse the store's processing queue.
  group: mobile-submit-${{ github.event.inputs.profile || 'production' }}
  cancel-in-progress: false

jobs:
  submit:
    name: Submit the latest build to the store
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Submit the latest build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          platform="${{ github.event.inputs.platform || 'ios' }}"
          profile="${{ github.event.inputs.profile || 'production' }}"

          echo "Submitting the latest ${platform} build on the ${profile} profile."
          # --latest selects the newest finished build for the platform and waits
          # for one that is still building. No --no-wait: a submit that returns
          # before the upload finishes would report success it cannot vouch for.
          if ! npx eas-cli submit \
                --platform "$platform" \
                --profile "$profile" \
                --latest \
                --non-interactive; then
            cat <<'EOF'
          The submit did not complete.

          The usual first-time cause is App Store Connect authentication: the API
          key on the EAS credentials service needs its Apple Team ID. It is pinned
          in eas.json (submit.production.ios.appleTeamId); if this still fails to
          authenticate, re-add the App Store Connect API key on expo.dev under the
          project's credentials. See CLAUDE.md §9 — store credentials are on the
          human-only list.
          EOF
            exit 1
          fi

      - name: Say what happened
        if: always()
        run: |
          {
            echo "### Store submit"
            echo
            echo "Platform: \`${{ github.event.inputs.platform || 'ios' }}\` · Profile: \`${{ github.event.inputs.profile || 'production' }}\`"
            echo
            echo "On success the build is uploaded to the store and enters processing"
            echo "(App Store Connect: ~5–30 min, then it appears under TestFlight and"
            echo "is selectable on the version page). Creating the store version and"
            echo "pressing Submit for Review stay human steps."
          } >> "$GITHUB_STEP_SUMMARY"
