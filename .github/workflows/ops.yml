name: Ops

# ─────────────────────────────────────────────────────────────────────────────
# A hand-operated lever for the production stack, reachable when nobody's
# laptop can be. SSH access from a workstation can vanish exactly when it is
# needed — a banned IP, a lost key, a laptop in another timezone — and the
# answer to that must not be "wait".
#
# Every action here is a fixed, named command. There is deliberately no
# free-text command input: a workflow that runs arbitrary strings on the
# production host as root is a remote shell with an audit log, and anyone who
# can open a pull request eventually finds it.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'What to do on the production host'
        required: true
        type: choice
        options:
          - status          # what is running, and is the database answering
          - storage-report  # disk, Docker categories, Sawa images, backup size
          - start-stack     # bring the production stack up (db included)
          - restart-api     # restart just the API
          - rollback        # ops/rollback.sh — back to the previous revision
          - prune-builders  # clear wedged/leftover BuildKit state and cache
          - list-stale      # what abandoned one-off containers are lying around
          - cleanup-stale   # remove them (and reclaim the images they pinned)
          - convert-rwf-dry     # restate USD money in RWF — DRY RUN, rolls back
          - convert-rwf-commit  # the real thing: writes, audited in fx_conversions

concurrency:
  group: deploy-production   # never race a deploy
  cancel-in-progress: false

jobs:
  ops:
    name: ${{ inputs.action }}
    runs-on: ubuntu-latest
    # No lever that mutates production should be able to run to the 6-hour
    # default: a wedged one holds the deploy-production concurrency group, so it
    # blocks every deploy behind it for the rest of the day.
    #
    # Sized for the slowest action, which is rollback, and sized ABOVE it rather
    # than under: ops/rollback.sh still REBUILDS both Next.js apps on the host
    # (20-40 minutes on this box). A cap that fires mid-build would kill it
    # after the previous revision has been checked out and before anything is
    # restarted — old code on disk, bad containers still serving, and the
    # pointer not consumed. Job = sum of the step caps (2 + 50) plus slack.
    timeout-minutes: 55
    environment:
      name: production
      url: https://sawacars.com

    steps:
      - name: Load the deploy key
        timeout-minutes: 2
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "${{ secrets.VPS_HOST_KEY }}" ]; then
            printf '%s\n' "${{ secrets.VPS_HOST_KEY }}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -T 15 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Run
        # Long enough for a rollback's on-host rebuild to finish (see the job
        # comment). Every other action is seconds — plus up to 220s of connect
        # probing (5 × 20s timeout + 4 × 30s wait) before any of them start.
        timeout-minutes: 50
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          APP_DIR: ${{ secrets.VPS_APP_DIR }}
          ACTION: ${{ inputs.action }}
          # The revision this lever's own ops scripts are read from — see
          # load_script below. Not checked out; only read out of the object
          # database, so the host's working tree is untouched.
          REF: ${{ github.sha }}
          # ops/rollback.sh stops for confirmation when the deploy it is undoing
          # carried migrations. There is no terminal here, so the decision has
          # to be made in advance: rolling back CODE only is the documented safe
          # case for additive migrations. A destructive migration needs
          # ops/restore.sh by hand, which this lever deliberately cannot do.
          CONFIRM: continue
        run: |
          set -euo pipefail

          # ── Wait for the connection before doing anything with it ────────────
          # This lever connected exactly once, with a 20s timeout, and died with
          # exit 255 on the first dropped packet. deploy.yml has probed and
          # retried since it was written; ops.yml never did, which made the tool
          # you reach for WHEN PRODUCTION IS BROKEN the least resilient of the
          # two. Two list-stale runs failed this way minutes after a deploy had
          # succeeded over the same key to the same host — the deploy retried
          # through what ops could not.
          #
          # A burst of deploys is also enough to look like an attack: each one
          # opens two SSH sessions from a fresh runner IP, and brute-force
          # protection on the host drops packets for a while afterwards. That
          # produces a timeout rather than a refusal, and it passes on its own.
          #
          # Only the PROBE is retried. The action itself still runs exactly once:
          # rollback is not safe to re-run because a connection died halfway
          # through it, and a lever that might silently do a thing twice is worse
          # than one that fails loudly.
          probe() {
            ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 \
                -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
                "$USER@$HOST" true 2>&1
          }
          for attempt in 1 2 3 4 5; do
            if out="$(probe)"; then
              [ "$attempt" = 1 ] || echo "connected on attempt $attempt"
              break
            fi
            echo "connect attempt $attempt: ${out:-no output}"
            if [ "$attempt" = 5 ]; then
              # Name the failure mode. All three arrive as exit 255 and they need
              # completely different responses, so the log should not make the
              # reader guess which one happened.
              case "$out" in
                *"Connection timed out"*|*"No route to host"*)
                  echo "::error::Host unreachable on port 22 — packets are being dropped, not refused."
                  echo "::error::Usually brute-force protection (fail2ban) or a firewall rule after a burst"
                  echo "::error::of runner connections; it clears on its own. Check the public surfaces before"
                  echo "::error::assuming the host is down, and use the provider console rather than SSH to unban." ;;
                *"Connection refused"*)
                  echo "::error::Port 22 refused the connection — sshd is not listening. The host is up (or this"
                  echo "::error::would time out instead), so this is sshd itself, not the network." ;;
                *"Permission denied"*|*"Too many authentication failures"*)
                  echo "::error::Reached sshd but the key was rejected — VPS_SSH_KEY or VPS_USER is wrong." ;;
                *"Host key verification failed"*|*"REMOTE HOST IDENTIFICATION HAS CHANGED"*)
                  echo "::error::Host key mismatch — the box was rebuilt, or VPS_HOST_KEY is stale." ;;
                *)
                  echo "::error::Server unreachable over SSH: ${out:-no output}" ;;
              esac
              exit 1
            fi
            echo "waiting 30s"
            sleep 30
          done

          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              "$USER@$HOST" \
              "APP_DIR=$(printf %q "$APP_DIR") ACTION=$(printf %q "$ACTION") CONFIRM=$(printf %q "$CONFIRM") REF=$(printf %q "$REF") bash -s" <<'REMOTE'
          set -euo pipefail
          APP_DIR="${APP_DIR:-}"
          REF="${REF:-HEAD}"
          if [ -z "$APP_DIR" ]; then
            for c in /srv/sawa /opt/sawa /root/sawa /var/www/sawa; do
              [ -x "$c/ops/deploy.sh" ] && APP_DIR="$c" && break
            done
          fi
          [ -n "$APP_DIR" ] || { echo "could not locate the checkout"; exit 1; }
          cd "$APP_DIR"

          # Production runs from docker-compose.prod.yml. The default compose
          # file is the development one, which publishes the database port and
          # therefore collides with the running stack.
          COMPOSE="docker compose -f docker-compose.prod.yml"

          # Consumed by ops/rollback.sh, which cannot ask an interactive
          # question down an SSH heredoc.
          export CONFIRM="${CONFIRM:-}"

          # ── Run ops scripts from the DISPATCHED revision, not from disk ─────
          # The host's checkout is whatever the last deploy left there, which is
          # by definition behind whenever this lever is being used to fix
          # something. A new action that calls a new script would fail with "no
          # such file" on its first and most important use.
          #
          # So: materialise the script from the revision this workflow is running
          # at. `git show` reads the blob straight out of the object database —
          # nothing is checked out, so the running stack's working tree is left
          # exactly as it is (ops/rollback.sh depends on that).
          #
          # Falls back to the on-disk copy when the object is not reachable, so
          # this still works on a host that cannot reach GitHub.
          load_script() {
            local path="$1" dest
            dest="$(mktemp)"
            if ! git cat-file -e "$REF:$path" 2>/dev/null; then
              git fetch --quiet --all --tags 2>/dev/null || true
            fi
            if git cat-file -e "$REF:$path" 2>/dev/null; then
              git show "$REF:$path" > "$dest"
            elif [ -f "$path" ]; then
              echo "note: $REF unreachable — using the copy on disk" >&2
              cat "$path" > "$dest"
            else
              echo "$path is available neither at $REF nor on disk" >&2
              return 1
            fi
            chmod +x "$dest"
            printf '%s' "$dest"
          }

          case "$ACTION" in
            status)
              docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
              echo
              echo "--- revision ---"; git log -1 --format='%h %s'
              echo "--- api readiness ---"
              curl -fsS -m 5 http://127.0.0.1:4000/health/ready && echo || echo "NOT READY"
              ;;
            storage-report)
              root="$(docker info --format '{{.DockerRootDir}}' 2>/dev/null || echo /)"
              echo "--- filesystem ---"
              df -h "$root"
              echo
              echo "--- Docker summary ---"
              # Docker asks every builder for cache accounting here. A wedged
              # BuildKit instance can otherwise hold the production deployment
              # concurrency group for nearly an hour just for a read-only report.
              timeout 30s docker system df || echo "Docker summary timed out"
              echo
              echo "--- Sawa-managed images ---"
              timeout 15s docker image ls --filter 'label=com.sawacars.managed=true' \
                --format 'table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.Size}}' \
                || echo "Sawa image listing timed out"
              echo
              echo "--- all image inventory (read-only) ---"
              timeout 15s docker image ls --all \
                --format 'table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.Size}}\t{{.CreatedSince}}' \
                || echo "Image inventory timed out"
              echo
              echo "--- dangling image ownership labels (read-only) ---"
              timeout 20s sh -c 'docker image ls -q --filter dangling=true | sort -u | while read -r id; do docker image inspect -f "{{.Id}} {{json .Config.Labels}}" "$id"; done' \
                || echo "Dangling image label inventory timed out"
              echo
              echo "--- local backups ---"
              timeout 20s du -sh /var/backups/sawa 2>/dev/null || echo "not readable, not configured, or timed out"
              echo
              echo "--- uploads volume ---"
              uploads="$(docker volume inspect sawa_uploads -f '{{.Mountpoint}}' 2>/dev/null || true)"
              [ -n "$uploads" ] && timeout 20s du -sh "$uploads" 2>/dev/null || echo "not readable, not configured, or timed out"
              ;;
            start-stack)
              $COMPOSE up -d
              sleep 5
              docker ps --format 'table {{.Names}}\t{{.Status}}'
              ;;
            restart-api)
              $COMPOSE restart api
              ;;
            rollback)
              ops/rollback.sh
              ;;
            prune-builders)
              # A cancelled remote build can leave BuildKit jobs and locks
              # behind; they sit on CPU and disk until cleared. Running
              # containers and tagged images are untouched by either command.
              docker builder prune -af || true
              docker image prune -f || true
              df -h / | tail -1
              ;;
            list-stale)
              # Read-only. Same filter and same age rule as the real thing, so
              # what this prints is exactly what cleanup-stale would remove.
              REAPER="$(load_script ops/reap-oneoffs.sh)"
              DRY_RUN=1 bash "$REAPER"
              ;;
            cleanup-stale)
              # A cancelled deploy leaves its `compose run` container running —
              # `--rm` is client-side, and a cancelled job has no client left to
              # honour it. Each survivor is a second API process against the live
              # database, and it pins the image it was built from, so the disk it
              # holds is unreclaimable while it lives.
              #
              # ops/reap-oneoffs.sh filters on the compose project + oneoff
              # labels, never on the container name: this host is shared, and a
              # name match would reach a neighbour's containers. Service
              # containers are oneoff=False and cannot match, so this is safe
              # against a live stack.
              REAPER="$(load_script ops/reap-oneoffs.sh)"
              echo "--- before ---"
              docker ps -a --format 'table {{.Names}}\t{{.Status}}' | head -20
              echo
              bash "$REAPER"
              echo
              # Now that nothing references them, the images those containers
              # were holding become reclaimable. Dangling only — tagged images
              # stay, so the rollback window is untouched.
              echo "--- reclaiming images the survivors were pinning ---"
              docker image prune -f || true
              echo
              echo "--- after ---"
              docker ps -a --format 'table {{.Names}}\t{{.Status}}' | head -20
              echo
              df -h "$(docker info --format '{{.DockerRootDir}}' 2>/dev/null || echo /)" | tail -1
              echo "--- api readiness ---"
              curl -fsS -m 5 http://127.0.0.1:4000/health/ready && echo || echo "NOT READY"
              ;;
            convert-rwf-dry|convert-rwf-commit)
              # scripts/convert-to-rwf.js restates every USD-labelled amount in
              # RWF. It runs INSIDE the api image (same code, same DB env as the
              # live service) at the platform's live FX rate, and refuses a
              # stale rate on its own. The dry action shows exactly what would
              # change and rolls back; the commit action is the one decision
              # this lever cannot make for you — it writes every change to
              # fx_conversions first, so any restated amount can be explained
              # and reversed. Idempotent either way: only rows still marked USD
              # are touched, so a re-run cannot double-convert.
              ARGS="--rate=live"
              if [ "$ACTION" = "convert-rwf-commit" ]; then
                ARGS="$ARGS --commit --note=ops-lever-$(date -u +%Y%m%dT%H%MZ)"
              fi
              # shellcheck disable=SC2086
              $COMPOSE run --rm -T --entrypoint node api scripts/convert-to-rwf.js $ARGS
              ;;
            *)
              echo "unknown action: $ACTION"; exit 1 ;;
          esac
          REMOTE
