name: Mobile Over-The-Air Update

# ─────────────────────────────────────────────────────────────────────────────
# Publishing a new JavaScript bundle to installed apps.
#
# This workflow used to run on every push to main that touched src/ — in
# parallel with CI, not after it. So a bundle could reach every phone in Rwanda
# before the tests that would have caught it had finished, and a syntax error
# in a screen would ship to users and to the test report at the same moment.
# It now runs only after CI is green on main, on the exact commit CI validated,
# which is the same rule deploy.yml follows for the servers.
#
# ── What can travel this way, and what cannot ────────────────────────────────
# runtimeVersion is `appVersion` (app.config.js), so an update reaches every
# installed build of the same `version`. JavaScript, images, fonts, copy and
# business rules all travel. A new native dependency does NOT: the bundle would
# reference a module the installed binary does not contain and the app would
# crash on launch — for everyone, with no way to roll back from the user's side.
#
# That is the one genuinely dangerous mistake available here, so the guard below
# refuses to publish when a native-sensitive file changes — and mobile-build.yml
# picks that commit up instead, triggering on the identical predicate. Between
# the two, every commit that reaches main reaches users by exactly one path:
# over the air when it can travel that way, and as a new binary when it cannot.
# If you widen the predicate in one file, widen it in the other in the same
# commit, or a commit will satisfy neither and quietly reach nobody.
#
# "Changed" means changed since what installs of THIS runtime run (see "Find
# what installed apps of this version are running"), so a version bump does not
# hold updates back once its store builds exist.
#
# ── The stop switch ──────────────────────────────────────────────────────────
# Before publishing, this workflow asks the API whether over-the-air updates are
# paused (`ota_paused` on the `app_release` setting). An operator can therefore
# halt every update from the admin console — no GitHub account, no laptop, no
# deploy. It is checked here rather than enforced in the app because the point
# is to stop a bad bundle from ever leaving, not to ask installs to ignore one
# that already arrived.
#
# If the API cannot be reached the publish is REFUSED. A stop switch you cannot
# read is not a stop switch, and the moment you most need it is exactly the
# moment production is least healthy. Re-run with `ignore_pause` to override.
#
# ── The channel ──────────────────────────────────────────────────────────────
# Publishing goes to a BRANCH; an installed app subscribes to a CHANNEL. For
# months this workflow published to branch `production` while no build profile
# in eas.json declared a channel, so nothing was subscribed and every update
# went nowhere. eas.json now sets channel `production` and `preview`. A build
# has to be made AFTER that change for it to carry the channel — an app built
# before it will never receive updates, whatever this workflow publishes.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_run:
    # Deploy, not CI — and the difference is a bug this workflow already hit.
    #
    # deploy.yml and this file both used to trigger on CI completion, so they
    # ran in PARALLEL. This workflow asks the API whether updates are paused;
    # the deploy restarts that API. Every deploy therefore raced its own OTA
    # publish, and on 2026-08-30 the stop-switch check timed out three times
    # against an API that was mid-restart and failed the run.
    #
    # Chaining on Deploy fixes it by construction rather than by lock ordering,
    # and it is the right order anyway: a JavaScript bundle that expects a new
    # endpoint should not reach phones before the backend serving it is live.
    workflows: ['Deploy']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: 'EAS Update branch to publish to'
        required: false
        default: 'production'
      allow_native_changes:
        description: 'Publish even though native-sensitive files changed (only if you have already shipped a matching build)'
        type: boolean
        required: false
        default: false
      ignore_pause:
        description: 'Publish even though over-the-air updates are paused in the admin console'
        type: boolean
        required: false
        default: false
      publish_current_tree:
        description: 'Publish what is on the branch NOW, ignoring which files this commit changed (use to recover a publish that was lost)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  # ONE production lane, shared with deploy.yml, ops.yml and mobile-rollback.yml.
  #
  # It serves two purposes at once: two overlapping publishes would race to be
  # the newest update, with timing deciding the winner; and a restart-api lever
  # pulled during a publish puts the stop-switch check back in the same race
  # the trigger change above removes.
  group: deploy-production
  cancel-in-progress: false

jobs:
  update:
    name: Publish EAS OTA Update (iOS & Android)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A red CI must never reach a phone. workflow_dispatch is the deliberate
    # human override and is allowed through.
    # A red CI never reaches a phone, and now neither does a failed or skipped
    # deploy: a bundle built for a backend that did not ship is worse than no
    # bundle. workflow_dispatch is the deliberate human override.
    #
    # And only for Deploy runs of THIS repository. Deploy itself refuses fork
    # pull requests, so this is a second lock on the same door; the commit
    # check below is a third.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)

    steps:
      - name: Checkout the commit CI validated
        uses: actions/checkout@v5
        with:
          # The triggering commit, not whatever main has moved on to — the whole
          # point of gating on CI is publishing the tree that passed.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Needed to diff against what is already published, which may be
          # many commits back.
          fetch-depth: 0
          persist-credentials: false

      # Defence in depth behind the job's `if:`. Whatever triggered this run,
      # the commit it is about to install and hand EXPO_TOKEN to must already be
      # part of main. A fork's pull-request commit can be fetched by SHA, but it
      # is never an ancestor of main.
      - name: Refuse a commit that is not on main
        if: github.event_name == 'workflow_run'
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # fetch-depth: 0 above already brought every branch, main included.
          if ! git merge-base --is-ancestor "$HEAD_SHA" origin/main; then
            echo "::error title=Untrusted commit::$HEAD_SHA is not on main; refusing to run with release credentials."
            exit 1
          fi

      # Node moves ABOVE the decision because the decision now asks EAS what is
      # actually on the channel, rather than guessing from the commit's diff.
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # ── What are installed apps of THIS version actually running? ────────────
      #
      # The bundle's message carries the commit it was built from — put there
      # for exactly this question. Reading it back turns "what changed in this
      # commit" into "what changed since the code people are actually running",
      # which is the question that matters and the one this workflow got wrong.
      #
      # Asked per runtime. An update only ever reaches installs of its own
      # runtimeVersion (= `version`), so the baseline must be of that runtime
      # too. Asking for "the latest update on the branch" instead compared every
      # 2.0.1 commit against a 2.0.0 bundle, saw the `version` bump in
      # app.config.js as a native change, and declined to publish from
      # 20 to 25 Oct 2026 while 2.0.1 phones got nothing.
      #
      # When this runtime has no update yet (the first publish after a bump),
      # the baselines are the commits its finished store builds were made from,
      # every one of them: some phone may run each. A native file that changed
      # since ANY of them still blocks (a later splash tweak included, as it
      # always has; tick allow_native_changes once that build is out).
      # No finished build yet means no install can receive an update; the run
      # declines and the first merge after the builds finish publishes.
      #
      # Never fails the run: if EAS cannot be reached, the next step falls back
      # to the commit's own diff and says so.
      - name: Find what installed apps of this version are running
        id: published
        continue-on-error: true
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -uo pipefail
          branch="${{ github.event.inputs.branch || 'production' }}"
          # Exactly one source= line per run: update | build | none | unknown.
          unknown() { echo "::notice::$1; falling back to this commit's own diff."; echo "source=unknown" >> "$GITHUB_OUTPUT"; exit 0; }

          # runtimeVersion policy is appVersion (release:check insists), so the
          # runtime is the `version` app.config.js resolves to.
          runtime="$(npx expo config --json --type public 2>/dev/null | node -e '
            let s = "";
            process.stdin.on("data", (d) => (s += d)).on("end", () => {
              try {
                const j = JSON.parse(s);
                const rv = typeof j.runtimeVersion === "string" ? j.runtimeVersion : j.version;
                process.stdout.write(String(rv || ""));
              } catch { process.stdout.write(""); }
            });
          ' 2>/dev/null || echo '')"
          [ -n "${runtime}" ] || unknown "Could not resolve the runtime version"
          echo "runtime=${runtime}" >> "$GITHUB_OUTPUT"
          echo "Runtime version: ${runtime}"

          # Commits named in an eas-cli JSON answer, one per line. The shape has
          # moved between eas-cli versions, so hunt for the fields rather than
          # trusting one path through the object. mode=update reads the commit
          # from the newest update's message; mode=build takes gitCommitHash from
          # every build listed.
          shas_from() {
            node -e '
              const mode = process.argv[1];
              let s = "";
              process.stdin.on("data", (d) => (s += d)).on("end", () => {
                const out = [];
                try {
                  const seen = new Set();
                  const walk = (node) => {
                    if (!node || typeof node !== "object" || seen.has(node)) return;
                    seen.add(node);
                    if (mode === "update" && typeof node.message === "string") {
                      const m = node.message.match(/\b([0-9a-f]{7,40})\b/);
                      if (m && out.length === 0) out.push(m[1]);
                    }
                    if (mode === "build" && typeof node.gitCommitHash === "string" && node.platform) {
                      out.push(node.gitCommitHash);
                    }
                    for (const v of Object.values(node)) walk(v);
                  };
                  walk(JSON.parse(s));
                } catch {}
                process.stdout.write([...new Set(out)].join("\n"));
              });
            ' "$1" 2>/dev/null || true
          }
          known() { while read -r c || [ -n "$c" ]; do [ -n "$c" ] && git cat-file -e "${c}^{commit}" 2>/dev/null && echo "$c"; done; }

          raw="$(npx eas-cli update:list --branch "$branch" --runtime-version "$runtime" --limit 1 --json --non-interactive 2>/dev/null)" \
            || unknown "EAS did not answer update:list"
          sha="$(printf '%s' "$raw" | shas_from update | known | head -n 1)"
          if [ -n "${sha}" ]; then
            echo "Runtime ${runtime}'s published bundle was built from ${sha}."
            { echo "source=update"; echo "shas=${sha}"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Runtime ${runtime} has no update on '${branch}' yet; looking for its store builds."
          raw="$(npx eas-cli build:list --runtime-version "$runtime" --channel "$branch" --status finished --platform all --limit 20 --json --non-interactive 2>/dev/null)" \
            || unknown "EAS did not answer build:list"
          shas="$(printf '%s' "$raw" | shas_from build | known | tr '\n' ' ' | sed 's/ *$//')"
          if [ -n "${shas}" ]; then
            echo "Store builds of ${runtime} were made from: ${shas}"
            { echo "source=build"; echo "shas=${shas}"; } >> "$GITHUB_OUTPUT"
          else
            echo "No finished '${branch}' build of ${runtime} (from a commit on main) yet."
            echo "source=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide whether this commit should be published
        id: scope
        run: |
          set -euo pipefail
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          source="${{ steps.published.outputs.source }}"
          runtime="${{ steps.published.outputs.runtime }}"
          bases="${{ steps.published.outputs.shas }}"

          # Diff against WHAT IS RUNNING ON PHONES of this runtime, not against
          # the previous commit.
          #
          # The old range was ${sha}^..${sha} — "did this commit change the
          # app?". That is a proxy for "is there anything to ship", and the two
          # come apart precisely when it hurts: a publish fails for an unrelated
          # reason, the next commit touches something else, and the workflow
          # goes green forever while the work sits unshipped. That happened on
          # 2026-08-30 and, from the run history, on runs 20 and 22 before it —
          # the symptom being an app that quietly stays old.
          #
          # Comparing against the published commit makes a lost publish heal
          # itself on the next commit instead of needing somebody to notice.
          # Against store builds (first publish of a runtime) the range is the
          # union over every build, so a native change since any of them blocks.
          no_build=false
          case "${source}" in
            update|build)
              changed=""
              for base in ${bases}; do
                changed="$(printf '%s\n%s' "${changed}" "$(git diff --name-only "${base}" "${sha}")")"
              done
              changed="$(printf '%s\n' "${changed}" | sed '/^$/d' | sort -u)"
              if [ "${source}" = "update" ]; then
                echo "Comparing against runtime ${runtime}'s published bundle (${bases:0:8})."
              else
                echo "First update for runtime ${runtime}: comparing against its store builds (${bases})."
              fi
              ;;
            none)
              # Nothing installed can receive an update of this runtime yet.
              no_build=true
              changed="$(git diff --name-only "${sha}^" "${sha}" 2>/dev/null || git ls-tree -r --name-only "${sha}")"
              echo "No finished store build of runtime ${runtime} yet."
              ;;
            *)
              if git rev-parse --verify -q "${sha}^" >/dev/null; then
                changed="$(git diff --name-only "${sha}^" "${sha}")"
                echo "Comparing against the previous commit."
              else
                changed="$(git ls-tree -r --name-only "${sha}")"
              fi
              ;;
          esac
          echo "Changed files:"; echo "${changed}" | sed 's/^/  /'

          # Does anything in the mobile bundle change? If a commit only touched
          # the backend or the website there is nothing to publish, and a
          # pointless update still makes every phone re-download a bundle.
          mobile=false
          if echo "${changed}" | grep -qE '^(src/|assets/|App\.js|index\.js|babel\.config\.js|metro\.config\.js|package(-lock)?\.json|app\.config\.js)'; then
            mobile=true
          elif [ "${{ github.event.inputs.publish_current_tree }}" = "true" ]; then
            # "Publish what is on the branch now", regardless of this commit's
            # own diff.
            #
            # Every other path here asks "did THIS commit change the bundle?",
            # which is the right question for an automatic publish and the wrong
            # one for recovery. On 2026-08-30 a publish was lost to an unrelated
            # failure; the fix commit touched only .github/workflows, so the
            # next automatic run correctly found no mobile files and published
            # nothing — leaving a tree full of unshipped app changes and no way
            # to ship them short of an empty commit. This is that way.
            mobile=true
            echo "::notice::publish_current_tree — publishing the branch as it stands, not this commit's diff."
          else
            echo "::notice::No mobile files changed — nothing to publish."
          fi
          echo "mobile=${mobile}" >> "$GITHUB_OUTPUT"

          # Native-sensitive: a change here may mean the installed binary no
          # longer matches the bundle. package-lock alone counts, because a
          # transitive native dependency can move without package.json moving.
          #
          # Measured over the same range, which makes this stricter and more
          # correct than before: the real question is whether anything native
          # moved since the bundle installs are RUNNING, not since last commit.
          native=false
          if echo "${changed}" | grep -qE '^(package(-lock)?\.json|app\.config\.js|eas\.json|plugins/)'; then
            native=true
          fi
          echo "native=${native}" >> "$GITHUB_OUTPUT"

          # The single answer every later step reads, so no step re-derives it and
          # they cannot disagree about what this commit is.
          allow="${{ github.event.inputs.allow_native_changes }}"
          publish=false
          if [ "${mobile}" = "true" ] && [ "${no_build}" = "false" ] && { [ "${native}" = "false" ] || [ "${allow}" = "true" ]; }; then
            publish=true
          fi
          # allow_native_changes is the override for "no store build yet" too:
          # an update nothing can receive does no harm.
          if [ "${mobile}" = "true" ] && [ "${no_build}" = "true" ] && [ "${allow}" = "true" ]; then
            publish=true
          fi
          echo "no_build=${no_build}" >> "$GITHUB_OUTPUT"
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"
          echo "mobile=${mobile} native=${native} no_build=${no_build} allow=${allow:-false} -> publish=${publish}"

      # Exits 0, deliberately.
      #
      # The first version exited 1, so declining to ship a native change — the
      # correct, designed outcome — showed up as a red failed run next to the
      # genuine ones. A workflow that goes red when it is working teaches
      # everybody to stop reading red, and the next real failure is the one
      # nobody looks at. This is a decision, and it is reported as one.
      # Also exits 0: the first merge after the store builds finish publishes.
      - name: Wait for a store build of this version
        if: >-
          steps.scope.outputs.mobile == 'true' &&
          steps.scope.outputs.no_build == 'true' &&
          steps.scope.outputs.publish != 'true'
        env:
          RUNTIME: ${{ steps.published.outputs.runtime }}
        run: |
          {
            echo "### Not published over the air — no store build of ${RUNTIME} yet"
            echo
            echo "An update only reaches installs of its own version, and EAS has no finished"
            echo "build of ${RUNTIME} on this channel, so nothing could receive one."
            echo
            echo "Once \`mobile-build.yml\`'s builds finish, the next merge to main publishes"
            echo "automatically, compared against what those builds contain. Or re-run this"
            echo "workflow from the Actions tab once they have finished; no box needs ticking."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=No OTA update::No finished store build of ${RUNTIME} yet."

      - name: Decline to publish a native-sensitive change
        if: >-
          steps.scope.outputs.mobile == 'true' &&
          steps.scope.outputs.no_build != 'true' &&
          steps.scope.outputs.publish != 'true'
        run: |
          {
            echo "### Not published over the air — and nothing is wrong"
            echo
            echo "This commit touches \`package.json\`, \`package-lock.json\`, \`app.config.js\`,"
            echo "\`eas.json\` or \`plugins/\`, so the installed binary may no longer match the"
            echo "bundle an update would carry. Publishing one could crash every installed"
            echo "app on launch, so it was not published."
            echo
            echo "**\`mobile-build.yml\` handles this commit instead** — it triggers on exactly"
            echo "this condition and has started a new binary. Check its run for the build links."
            echo
            echo "If the change is JavaScript-only — a pure JS dependency, a copy tweak in"
            echo "\`app.config.js\` — re-run this workflow from the Actions tab with"
            echo "**allow_native_changes** ticked, and it will publish."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=No OTA update::Native-sensitive change; mobile-build.yml is cutting a binary for this commit instead."
          cat <<'EOF'
          This commit touches package.json, package-lock.json, app.config.js,
          eas.json or plugins/, so the installed binary may no longer match the
          bundle this would publish.

          If the change is JavaScript-only (a pure JS dependency, a copy tweak in
          app.config.js), re-run this workflow manually with
          "allow_native_changes" ticked.

          If it adds or upgrades a NATIVE module, changes a permission, or bumps
          `version`, publishing an update would crash every installed app on
          launch — so nothing was published here, and nothing needed to be:
          mobile-build.yml triggers on exactly this condition and has already
          started a new binary for this commit. Check its run.

          Submitting that build to the stores remains a human decision.
          EOF

      # Read the admin console's stop switch. Three attempts, because a single
      # transient blip should not look like a deliberate pause.
      - name: Check the over-the-air stop switch
        if: steps.scope.outputs.publish == 'true'
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.ignore_pause }}" = "true" ]; then
            echo "::warning title=Stop switch bypassed::Publishing with ignore_pause ticked."
            exit 0
          fi

          # Separate the two failures that curl -f used to flatten into one.
          #
          #   404  the API is up and has no stop switch — an older backend, or
          #        one rolled back below migration 0034. That is a definite
          #        answer meaning "nothing is paused", so publishing is right.
          #   else no answer at all. Unknown, so refuse.
          #
          # Flattening these meant a backend rollback would have blocked every
          # over-the-air update indefinitely, with no way to tell why.
          body=''
          status=''
          for attempt in 1 2 3 4 5; do
            status="$(curl -sS -o /tmp/release.json -w '%{http_code}' --max-time 20 \
                        https://api.sawacars.com/settings/app-release || echo '000')"
            if [ "${status}" = "200" ]; then body="$(cat /tmp/release.json)"; break; fi
            if [ "${status}" = "404" ]; then
              echo "::warning title=No stop switch::The API has no /settings/app-release (pre-0034 backend). Treating updates as not paused."
              exit 0
            fi
            echo "Attempt ${attempt} got HTTP ${status}."
            sleep $((attempt * 10))
          done

          if [ -z "${body}" ]; then
            echo "::error title=Could not read the stop switch::api.sawacars.com/settings/app-release did not answer."
            {
              echo "### Not published — the stop switch could not be read"
              echo
              echo "\`https://api.sawacars.com/settings/app-release\` did not answer after five tries,"
              echo "so this run cannot tell whether an operator has paused over-the-air updates."
              echo "It refused rather than guessed."
              echo
              echo "Check the API is healthy, then re-run this workflow. If you need to publish"
              echo "regardless, re-run it from the Actions tab with **ignore_pause** ticked."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          paused="$(printf '%s' "${body}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(String(JSON.parse(s).ota_paused===true))}catch{process.stdout.write("unreadable")}})')"
          reason="$(printf '%s' "${body}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(String(JSON.parse(s).ota_pause_reason||""))}catch{process.stdout.write("")}})')"

          if [ "${paused}" = "unreadable" ]; then
            echo "::error title=Stop switch unreadable::The endpoint answered but the payload was not JSON."
            exit 1
          fi
          if [ "${paused}" = "true" ]; then
            {
              echo "### Not published — over-the-air updates are paused"
              echo
              echo "An operator has paused updates in the admin console."
              [ -n "${reason}" ] && { echo; echo "> ${reason}"; }
              echo
              echo "Unpause under **Settings → App release**, then re-run this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Updates paused::${reason:-Paused in the admin console.}"
            exit 1
          fi
          echo "Stop switch is off — publishing."

      - name: Publish update to EAS (iOS and Android)
        if: steps.scope.outputs.publish == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Through env, never pasted into the script: a commit message is text
          # a pull-request author chose (a merge commit carries the PR title and
          # branch name), and inside `run:` any $(...) or backtick in it would
          # execute here, next to EXPO_TOKEN. Ordinary backticks and quotes in
          # messages used to break this step for the same reason.
          PUBLISH_BRANCH: ${{ github.event.inputs.branch || 'production' }}
          PUBLISH_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message || github.event.head_commit.message || 'manual publish' }}
        run: |
          set -euo pipefail
          branch="$PUBLISH_BRANCH"
          sha="$PUBLISH_SHA"
          msg="${sha:0:8} ${COMMIT_MESSAGE%%$'\n'*}"

          # ── Never loop over historical runtimes ─────────────────────────────
          # This step briefly published the SAME bundle to runtimes 1.0.4,
          # 1.0.3, 1.0.2, 1.0.1 and 1.0.0 by forcing APP_VERSION, so that
          # "every existing install receives this update regardless of native
          # build version". That is the precise thing runtimeVersion exists to
          # prevent, and it is why the app crashed on launch.
          #
          # This bundle imports expo-notifications, a NATIVE module added
          # during the 1.0.2 line. The 1.0.0 and 1.0.1 binaries do not contain
          # it, and App.js touches it on every launch. A JavaScript bundle
          # cannot add a native module to a binary that shipped without one —
          # the header of this file says exactly that, and the native-change
          # guard above exists for this failure.
          #
          # Reaching older installs is a STORE BUILD's job. An update reaches
          # the runtime it was built for, and only that one.
          # --environment loads the EAS variables into the bundle, as `eas build`
          # does for the binary. Without it every EXPO_PUBLIC_* value is empty
          # in the update: the Oct 2026 publish shipped without the Google
          # client ids and hid Sign in with Google on every phone. The branch
          # picks the environment its binaries were built with (eas.json).
          case "$branch" in
            preview) environment=preview ;;
            *)       environment=production ;;
          esac
          npx eas-cli update \
            --branch "$branch" \
            --platform all \
            --environment "$environment" \
            --message "$msg" \
            --non-interactive

      - name: Confirm the update is subscribed to by real builds
        if: steps.scope.outputs.publish == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          branch="${{ github.event.inputs.branch || 'production' }}"
          echo "── Latest updates on branch ${branch} ──"
          npx eas-cli update:list --branch "$branch" --limit 3 --non-interactive || true
          echo
          echo "── Channel → branch mapping ──"
          # This is the step that would have caught the original fault: a channel
          # with no branch, or no channel at all, means nothing is listening and
          # the publish above reached nobody.
          npx eas-cli channel:view "$branch" --non-interactive || {
            echo "::warning::Channel '${branch}' does not exist yet. It is created by the first"
            echo "::warning::build made with \"channel\": \"${branch}\" in eas.json. Until such a"
            echo "::warning::build is installed, published updates reach no one."
          }
