name: Mobile Over-The-Air Update

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'App.js'
      - 'app.config.js'
      - 'package.json'
      - 'eas.json'
  workflow_dispatch:
    inputs:
      branch:
        description: 'EAS Update branch to publish to (e.g. production, preview)'
        required: false
        default: 'production'

concurrency:
  group: mobile-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    name: Publish EAS OTA Update
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Publish update to EAS
        run: |
          npx eas-cli update --auto --non-interactive
