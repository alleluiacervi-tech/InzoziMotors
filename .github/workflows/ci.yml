name: CI

# One pipeline, four surfaces. Every push and PR to main proves the same
# things a reviewer would check by hand: the backend parses (JS and its SQL),
# the Expo app compiles under Metro's preset, and both Next apps type-check
# and produce production builds. No deploy here — the VPS flow stays manual
# per the deployment guide.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — syntax, SQL grammar, API tests
    runs-on: ubuntu-latest

    # The suite runs against a real PostgreSQL on purpose. What it verifies —
    # transactions, row locks, unique constraints, cascade behaviour — is
    # exactly what a mocked pool would paper over.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sawa_test
          POSTGRES_USER: sawa
          POSTGRES_PASSWORD: sawa_test_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sawa -d sawa_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: sawa_test
      DB_USER: sawa
      DB_PASSWORD: sawa_test_password
      JWT_SECRET: ci_secret_at_least_32_characters_long_x
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
        working-directory: backend
      - name: node --check every source file
        run: |
          set -e
          for f in $(find backend/src backend/server.js -name '*.js'); do
            node --check "$f"
          done
      - name: Parse all SQL with the real PostgreSQL grammar
        run: |
          npm install --no-save libpg-query@17
          node .github/scripts/check-sql.js
      - name: Apply the schema
        run: node src/db-init.js
        working-directory: backend
      - name: API tests
        run: npm test
        working-directory: backend

  mobile:
    name: Mobile — babel parse + import resolution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: package-lock.json }
      - run: npm ci
      - name: Every src file parses under babel-preset-expo
        run: |
          node -e "
          const fs=require('fs'),path=require('path'),babel=require('@babel/core');
          let bad=0,n=0;
          const walk=(d)=>{for(const e of fs.readdirSync(d,{withFileTypes:true})){
            const p=path.join(d,e.name);
            if(e.isDirectory())walk(p);
            else if(e.name.endsWith('.js')){n++;
              try{babel.transformFileSync(p,{presets:['babel-preset-expo'],babelrc:false,configFile:false})}
              catch(err){bad++;console.log('FAIL',p,err.message.split('\n')[0])}}}};
          walk('src');['App.js','app.config.js'].forEach(f=>{n++;
            try{babel.transformFileSync(f,{presets:['babel-preset-expo'],babelrc:false,configFile:false})}
            catch(err){bad++;console.log('FAIL',f,err.message.split('\n')[0])}});
          console.log(n+' files, '+bad+' failures');
          process.exit(bad?1:0);"

  web:
    name: Website — typecheck + production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: npx tsc --noEmit
        working-directory: web
      # The API is intentionally absent in CI — the build must succeed anyway;
      # that IS the degradation contract the site promises.
      - run: npm run build
        working-directory: web

  admin:
    name: Admin — typecheck + production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: admin/package-lock.json }
      - run: npm ci
        working-directory: admin
      - run: npx tsc --noEmit
        working-directory: admin
      - run: npm run build
        working-directory: admin
