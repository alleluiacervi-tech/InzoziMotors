name: CI

# One pipeline, four surfaces. Every push and PR to main proves the same
# things a reviewer would check by hand: the backend parses (JS and its SQL),
# the Expo app compiles under Metro's preset, and both Next apps type-check
# and produce production builds. No deploy here — the VPS flow stays manual
# per the deployment guide.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Pushing twice in a minute used to run two full sets of four jobs, and the
# deploy that follows queued behind the stale one. Superseded runs of the same
# ref are cancelled — safe here, because CI only reads.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The API image is Alpine (musl), and `sharp` is a native dependency whose
  # musl build is the fiddliest platform it ships. Worse, SVG text needs
  # fontconfig installed or the plate badge composites with NO WORDMARK — a
  # black panel that looks almost right.
  #
  # Neither failure is visible from `npm test` on the runner's glibc Node, so
  # without this job both would surface for the first time during a deploy.
  # Building the real image and rendering a real badge inside it moves that
  # discovery onto the pull request, where it belongs.
  api-image:
    name: API image — native deps and fonts on Alpine
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5

      - name: Build the API image exactly as the deploy does
        run: docker build -t sawa-api:ci ./backend

      - name: The plate badge renders with its wordmark
        run: |
          docker run --rm sawa-api:ci node -e "
            require('/app/src/lib/plate-badge').assertBadgeRenders()
              .then(r => { console.log('badge ok, white share', r.white_share); })
              .catch(e => { console.error('BADGE FAILED:', e.code, e.message); process.exit(1); });
          "

  backend:
    name: Backend — syntax, SQL grammar, API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The suite runs against a real PostgreSQL on purpose. What it verifies —
    # transactions, row locks, unique constraints, cascade behaviour — is
    # exactly what a mocked pool would paper over.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sawa_test
          POSTGRES_USER: sawa
          POSTGRES_PASSWORD: sawa_test_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sawa -d sawa_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: sawa_test
      DB_USER: sawa
      DB_PASSWORD: sawa_test_password
      JWT_SECRET: ci_secret_at_least_32_characters_long_x
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
        working-directory: backend
      - name: node --check every source file
        run: |
          set -e
          for f in $(find backend/src backend/server.js -name '*.js'); do
            node --check "$f"
          done
      - name: Parse all SQL with the real PostgreSQL grammar
        run: |
          npm install --no-save libpg-query@17
          node .github/scripts/check-sql.js
      - name: Apply the schema
        run: node src/db-init.js
        working-directory: backend
      - name: API tests
        run: npm test
        working-directory: backend

  mobile:
    name: Mobile — babel parse + import resolution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20, cache: npm, cache-dependency-path: package-lock.json }
      - run: npm ci
      - name: Every src file parses under babel-preset-expo
        run: |
          node -e "
          const fs=require('fs'),path=require('path'),babel=require('@babel/core');
          let bad=0,n=0;
          const walk=(d)=>{for(const e of fs.readdirSync(d,{withFileTypes:true})){
            const p=path.join(d,e.name);
            if(e.isDirectory())walk(p);
            else if(e.name.endsWith('.js')){n++;
              try{babel.transformFileSync(p,{presets:['babel-preset-expo'],babelrc:false,configFile:false})}
              catch(err){bad++;console.log('FAIL',p,err.message.split('\n')[0])}}}};
          walk('src');['App.js','app.config.js'].forEach(f=>{n++;
            try{babel.transformFileSync(f,{presets:['babel-preset-expo'],babelrc:false,configFile:false})}
            catch(err){bad++;console.log('FAIL',f,err.message.split('\n')[0])}});
          console.log(n+' files, '+bad+' failures');
          process.exit(bad?1:0);"
      - name: Every relative mobile import resolves
        run: npm run mobile:imports

      # Parsing is not loading. The step above proves every file is valid
      # JavaScript and every import resolves; neither runs a line of it. A
      # style object spreading a token the file forgot to import parses
      # perfectly and throws the instant Hermes evaluates the module — before
      # React mounts, so ErrorBoundary never sees it and the app is simply
      # dead on launch. That is what shipped as 1.0.4 and 1.0.5.
      #
      # Invoked as a file rather than an npm script on purpose: a new entry in
      # package.json reads as native-sensitive to mobile-update.yml's guard,
      # which would have blocked the over-the-air fix this check was written
      # for. Nothing about the check needs package.json to change.
      - name: The bundle survives being loaded
        run: node scripts/check-module-scope.js

      # The release preflight was only ever run by hand, which is the same as
      # not having it: it guards against leaked provider keys in committed
      # templates, retired transaction APIs coming back, and — since the OTA
      # channel fault — a build profile that subscribes to no update branch.
      # None of those were being checked on any push.
      - name: Release preflight
        run: npm run release:check

  web:
    name: Website — typecheck + production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: npx tsc --noEmit
        working-directory: web
      # The API is intentionally absent in CI — the build must succeed anyway;
      # that IS the degradation contract the site promises.
      - run: npm run build
        working-directory: web

  admin:
    name: Admin — typecheck + production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20, cache: npm, cache-dependency-path: admin/package-lock.json }
      - run: npm ci
        working-directory: admin
      - run: npx tsc --noEmit
        working-directory: admin
      - run: npm run build
        working-directory: admin

  ops:
    name: Ops scripts — syntax + reaper tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      # A syntax error in ops/ is invisible until a deploy runs it on the
      # production host, which is the worst possible place to find out. Two
      # deploys have already been wedged by this file family.
      - name: Syntax
        run: |
          fail=0
          for f in ops/*.sh ops/test/*.sh; do
            bash -n "$f" || { echo "SYNTAX FAIL $f"; fail=1; }
          done
          exit $fail

      # ops/reap-oneoffs.sh removes running containers on a host shared with
      # another project. Its safety properties are asserted against a stubbed
      # docker; see the header of the test for why that is the only honest way
      # to check them.
      - name: Reaper safety tests
        run: |
          ops/test/reap-oneoffs.test.sh
          ops/test/prune-deploy-images.test.sh

      # The deploy and ops workflows run shell that lives inside YAML, and the
      # ops one additionally sends a script down an SSH heredoc. Neither the YAML
      # parser nor `bash -n ops/*.sh` looks at any of that, so a typo in the
      # remote half ships silently and fails on the production host.
      - name: Embedded remote scripts
        run: |
          python3 - <<'PY'
          import subprocess, sys, yaml

          def check(label, src):
              r = subprocess.run(['bash', '-n'], input=src, text=True, capture_output=True)
              if r.returncode:
                  print('SYNTAX FAIL', label)
                  print(r.stderr.strip()[:400])
                  return 1
              print('ok', label)
              return 0

          def heredocs(body):
              """Bodies of quoted heredocs (<<'WORD'), which bash -n on the outer
              script treats as opaque text rather than parsing."""
              out, lines = [], body.split('\n')
              i = 0
              while i < len(lines):
                  stripped = lines[i].rstrip()
                  if "<<'" in stripped and stripped.endswith("'"):
                      word = stripped.rsplit("<<'", 1)[1][:-1]
                      for j in range(i + 1, len(lines)):
                          if lines[j].strip() == word:
                              out.append(('<<' + word, '\n'.join(lines[i + 1:j])))
                              i = j
                              break
                  i += 1
              return out

          bad = 0
          for wf in ('.github/workflows/deploy.yml', '.github/workflows/ops.yml',
                     '.github/workflows/ci.yml'):
              doc = yaml.safe_load(open(wf))
              for job_id, job in doc['jobs'].items():
                  for n, step in enumerate(job.get('steps', [])):
                      body = step.get('run')
                      if not body:
                          continue
                      label = f"{wf} {job_id}/{step.get('name', n)}"
                      bad |= check(label, body)
                      for word, inner in heredocs(body):
                          # Only shell heredocs; PY blocks are python.
                          if word in ('<<PY', '<<JS', '<<SQL', '<<EOSQL'):
                              continue
                          bad |= check(f"{label} {word}", inner)
          sys.exit(bad)
          PY
