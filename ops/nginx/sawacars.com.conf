# sawacars.com (+ www) → the public website on 127.0.0.1:3002
#
# www redirects to the apex so the site has exactly one canonical origin —
# metadataBase, the sitemap and every OG card are built from
# NEXT_PUBLIC_SITE_URL=https://sawacars.com, and a second live hostname would
# split search ranking across duplicates.
#
# TLS: certbot --nginx -d sawacars.com -d www.sawacars.com

server {
    listen 80;
    listen [::]:80;
    server_name www.sawacars.com;
    # 301 after certbot upgrades this to https; the target is always the apex.
    return 301 $scheme://sawacars.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name sawacars.com;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next serves /.well-known from web/public/ — including the
    # apple-app-site-association and assetlinks.json that app deep links will
    # need once store credentials exist. Nothing special required here; noted
    # so nobody adds a block that shadows them.
}
