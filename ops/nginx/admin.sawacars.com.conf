# admin.sawacars.com → the operations dashboard on 127.0.0.1:3001
#
# Internal tool for the Sawa team, but it must be internet-reachable — staff
# work from phones and the inspection centres, so an IP allowlist would lock
# them out. The real boundary is auth: httpOnly session cookie, role checked
# server-side, 12-hour lifetime. Defence-in-depth options below if the team
# ever works from fixed addresses.
#
# TLS: certbot --nginx -d admin.sawacars.com

server {
    listen 80;
    listen [::]:80;
    server_name admin.sawacars.com;

    # KYC document views and listing edits go through the dashboard's own
    # /api/backend proxy; photo uploads pass through it too.
    client_max_body_size 100m;

    # Keep the operations tool out of search indexes regardless of app config.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # ── Optional hardening, enable when practical ──
    # allow 203.0.113.7;          # office / VPN egress IP
    # deny  all;
    # …or HTTP basic auth in front of the app's own login:
    # auth_basic           "Sawa Operations";
    # auth_basic_user_file /etc/nginx/.htpasswd-sawa-admin;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
