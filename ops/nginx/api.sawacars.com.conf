# api.sawacars.com → the Node API on 127.0.0.1:3000
#
# Serves three clients with one contract: the Expo app, the website's server
# and browser code, and the admin dashboard's proxy. Socket.io needs the
# Upgrade headers or real-time chat silently degrades to long-polling.
#
# Certbot manages TLS: this file listens on :80, and
#   certbot --nginx -d api.sawacars.com
# rewrites it with the 443 block and the redirect. Do not hand-edit the TLS
# parts afterwards — certbot owns them.

server {
    listen 80;
    listen [::]:80;
    server_name api.sawacars.com;

    # 36-angle photo batches run to tens of MB; the API's own multer limits
    # (10 MB/file, 40 files) are the real ceiling — this just has to be above it.
    client_max_body_size 100m;

    # The API already sets helmet's headers; Nginx must not double them.

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Without these, express's `trust proxy` sees 127.0.0.1 for everyone
        # and every rate-limit bucket collapses into one shared pool.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Socket.io websocket upgrade
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 75s;
    }
}
